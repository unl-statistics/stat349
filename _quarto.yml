project:
  type: website
  output-dir: docs
  pre-render:
    - code/gen-week-files-from-course-schedule.R
  render:
    - index.qmd
    - syllabus.qmd
    - course-links.qmd
    - course-overview.qmd
    - course-support.qmd
    - weeks/*.qmd
    - activities/*.qmd
    - assignment-repos/*/*.qmd
    - assignment-repos/*/*/*.qmd
    - instructions/*.qmd
    - instructions/methods-papers/*.qmd
    - homework/*.qmd
    - slides/*.qmd
 
engine: knitr
website:
  page-navigation: true
  title: "STAT 349 - Spring 2025"
  description: "Homepage for STAT 349 - Technical Communication."
  site-url: "https://unl-statistics.github.io/stat349"

  repo-url: https://github.com/unl-statistics/stat349
  repo-actions: [issue]

  open-graph: true

  twitter-card:
    creator: "@srvanderplas"
    image: "images/twitter-card.png"

  page-footer:
    left: "&copy; Copyright 2026, Susan Vanderplas"
    background: "$secondary"

  sidebar:
    background: "$secondary"
    aria-label: "Sidebar nagivation"
    logo: "images/logo.png"
    pinned: true
    align: center

    style: "docked"
    search: false
    collapse-level: 2
    contents:
      - section: "Course information"
        aria-label: "Course information"
        contents:
          - href: course-overview.qmd
            text: Overview
          - href: syllabus.qmd
            text: Syllabus
          - href: course-support.qmd
            text: Support
          - href: index.qmd
            text: Schedule
          - href: course-links.qmd
            text: Useful links
      - section: "Weekly materials"
        aria-label: "Weekly materials"
        contents:
          - href: weeks/week-010.qmd
            text: "Week 1 - Getting Started"
          - href: weeks/week-020.qmd
            text: "Week 2 - Resumes"
          - href: weeks/week-030.qmd
            text: "Week 3 - References"
          - href: weeks/week-040.qmd
            text: "Week 4 - Organization"
          - href: weeks/week-050.qmd
            text: "Week 5 - Arguments"
          - href: weeks/week-060.qmd
            text: "Week 6 - Problems & Data"
          - href: weeks/week-070.qmd
            text: "Week 7 - Methods"
          - href: weeks/week-080.qmd
            text: "Week 8 - Graphics"
          - href: weeks/week-090.qmd
            text: "Week 9 - Results"
          - href: weeks/week-100.qmd
            text: "Week 10 - Intro & Conclusions"
          - href: weeks/week-110.qmd
            text: "Week 11 - Summaries"
          - href: weeks/week-120.qmd
            text: "Week 12 - Fallacies"
          - href: weeks/week-130.qmd
            text: "Week 13 - Reports"
          - href: weeks/week-140.qmd
            text: "Week 14 - Editing"
          - href: weeks/week-150.qmd
            text: "Week 15 - Presentations"
            
fontsize: "18pt"
lineheight: "1.5ex"

format:
  html:
    page-layout: full
    grid:
      sidebar-width: 400px
      body-width: 800px
      margin-width: 0px
    theme:
      light: [flatly, theme.scss, _variables-flatly.scss]
      dark: [darkly, theme.scss, _variables-darkly.scss]
    mainfont: "Atkinson Hyperlegible"
    toc: true

execute:
  freeze: auto  # re-render only when source changes

